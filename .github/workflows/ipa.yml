name: PB Probe re-signable IPA
on:
  push:
    branches: [main, "mirsa/probe-access-test"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact discovery targeting
        run: |
          clang -fobjc-arc -framework Foundation Tests/DiscoveryTargets.m -o /tmp/pb-target-tests
          /tmp/pb-target-tests
      - name: Verify isolated write cleanup
        run: |
          python3 Tests/access-fixtures.py
          swift /tmp/pb-access-fixtures.swift
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile and package unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -project PBProbe.xcodeproj -scheme PBProbe -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PBProbe.app package/Payload/
          cp PBProbe.entitlements package/Payload/PBProbe.app/RequestedEntitlements.plist
          # Embed the requested group in a real ad-hoc signature so a signer can
          # discover it. This is NOT a device provisioning grant.
          codesign --force --sign - --entitlements PBProbe.entitlements \
            --generate-entitlement-der package/Payload/PBProbe.app
          codesign --verify --deep --strict package/Payload/PBProbe.app
          codesign --display --entitlements :- package/Payload/PBProbe.app > embedded-entitlements.plist
          python3 - <<'PYVERIFY'
          import plistlib
          p = plistlib.load(open("embedded-entitlements.plist", "rb"))
          assert p == {"com.apple.security.application-groups": ["group.com.alaa.pbprobe"]}, p
          PYVERIFY
          cd package
          zip -qry ../PB-Probe.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PB-Probe-unsigned
          path: PB-Probe.ipa
          if-no-files-found: error
